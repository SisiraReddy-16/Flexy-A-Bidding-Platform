<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Performance: preconnect before font CSS request fires -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Combined single request: icons + Manrope + Inter, display=swap avoids FOIT -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexy – Reset Password</title>  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
  <style>
    .reset-card { max-width:440px;width:100%;padding:2.5rem;background:var(--surface-container);border:1px solid var(--outline-variant);border-radius:1.5rem;margin:0 1rem; }
    .pw-strength-bar { height:.25rem;border-radius:9999px;background:var(--surface-container-high);margin-top:.5rem;overflow:hidden; }
    .pw-strength-fill { height:100%;border-radius:9999px;transition:width .3s,background .3s;width:0; }
    .pw-rules { display:flex;flex-wrap:wrap;gap:.35rem .75rem;margin-top:.5rem; }
    .pw-rule { font-size:.72rem;display:flex;align-items:center;gap:.25rem;color:var(--on-surface-variant);transition:color .2s; }
    .pw-rule.ok { color:#4ade80; }
    .pw-rule .material-symbols-outlined { font-size:.8rem; }
  </style>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--background);padding:1rem;">
  <div class="reset-card">
    <a href="/login" class="brand-logo" style="display:inline-block;margin-bottom:2rem;font-size:1.75rem;">Flexy</a>

    <div id="alertMsg" style="display:none;margin-bottom:1rem;padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;"></div>

    <h2 style="font-family:var(--font-headline);font-size:1.5rem;margin-bottom:.5rem;">Set New Password</h2>
    <p style="color:var(--on-surface-variant);margin-bottom:1.5rem;font-size:.9rem;">Choose a strong password. All active sessions will be logged out.</p>

    <form id="resetForm" class="login-form" novalidate style="display:flex;flex-direction:column;gap:1rem;">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrapper" style="position:relative;">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input class="form-input" type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" />
          <button type="button" id="pwToggle" tabindex="-1" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--on-surface-variant);padding:.25rem;">
            <span class="material-symbols-outlined" style="font-size:1.1rem;">visibility</span>
          </button>
        </div>
        <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwFill"></div></div>
        <div class="pw-rules">
          <span class="pw-rule" id="rule-len"><span class="material-symbols-outlined">close</span>8+ chars</span>
          <span class="pw-rule" id="rule-upper"><span class="material-symbols-outlined">close</span>Uppercase</span>
          <span class="pw-rule" id="rule-lower"><span class="material-symbols-outlined">close</span>Lowercase</span>
          <span class="pw-rule" id="rule-digit"><span class="material-symbols-outlined">close</span>Number</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">lock_reset</span>
          <input class="form-input" type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <p id="matchHint" style="font-size:.75rem;margin-top:.25rem;display:none;"></p>
      </div>
      <button type="submit" id="submitBtn" class="submit-btn" disabled style="opacity:.5;">Update Password</button>
    </form>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  const alertEl = document.getElementById('alertMsg');

  function showAlert(msg, isErr=true) {
    alertEl.innerHTML = msg;
    alertEl.style.cssText = `display:block;background:${isErr?'rgba(255,110,132,.1)':'rgba(0,227,253,.1)'};color:${isErr?'#ff6e84':'#00e3fd'};border:1px solid ${isErr?'rgba(255,110,132,.3)':'rgba(0,227,253,.3)'};padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem;`;
  }

  if (!token) {
    showAlert('Invalid or missing reset token. Please request a new password reset.');
    document.getElementById('resetForm').style.display = 'none';
  }

  /* ── show/hide password ── */
  document.getElementById('pwToggle').addEventListener('click', function() {
    const inp = document.getElementById('password');
    const icon = this.querySelector('.material-symbols-outlined');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
  });

  /* ── Strength meter ── */
  const rules = {
    len:   { re: /.{8,}/,   id: 'rule-len'   },
    upper: { re: /[A-Z]/,   id: 'rule-upper' },
    lower: { re: /[a-z]/,   id: 'rule-lower' },
    digit: { re: /\d/,      id: 'rule-digit' },
  };
  const fill = document.getElementById('pwFill');
  const btn  = document.getElementById('submitBtn');

  function validate() {
    const pw   = document.getElementById('password').value;
    const conf = document.getElementById('confirmPassword').value;
    let score  = 0;
    for (const [, rule] of Object.entries(rules)) {
      const ok = rule.re.test(pw);
      const el = document.getElementById(rule.id);
      el.classList.toggle('ok', ok);
      el.querySelector('.material-symbols-outlined').textContent = ok ? 'check' : 'close';
      if (ok) score++;
    }
    const color = score < 2 ? '#ff6e84' : score < 3 ? '#ff94a3' : score < 4 ? '#fbbf24' : '#4ade80';
    fill.style.width = (score/4*100) + '%';
    fill.style.background = color;
    const match = pw && pw === conf;
    const hint  = document.getElementById('matchHint');
    if (conf) { hint.style.display='block'; hint.textContent = match?'✓ Passwords match':'✗ Passwords do not match'; hint.style.color = match?'#4ade80':'#ff6e84'; }
    else hint.style.display='none';
    const ok = score === 4 && match;
    btn.disabled = !ok; btn.style.opacity = ok ? '1' : '.5';
  }

  document.getElementById('password').addEventListener('input', validate);
  document.getElementById('confirmPassword').addEventListener('input', validate);

  /* ── Submit ── */
  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const password = document.getElementById('password').value;
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      const res  = await fetch('/api/auth/reset-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (res.ok) {
        showAlert('✅ ' + data.message, false);
        document.getElementById('resetForm').style.display = 'none';
        setTimeout(() => window.location.href = '/login', 2500);
      } else {
        showAlert(data.error || 'Reset failed. The link may have expired.');
        btn.disabled=false; btn.textContent='Update Password';
      }
    } catch { showAlert('Connection error. Please try again.'); btn.disabled=false; btn.textContent='Update Password'; }
  });
})();
</script>
</body>
</html>
