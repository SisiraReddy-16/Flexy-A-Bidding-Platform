# .env (same file/keys as the Python version) is loaded if present; real env vars override it.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
server.port=${PORT:5000}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=500
spring.main.banner-mode=off
