services:
  - type: web
    name: flexy-backend
    runtime: docker
    envVars:
      - key: FLASK_ENV          # kept for compatibility: "production" => secure cookies
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: SEED_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SOCKET_URL         # public URL of the Socket.IO server (see README)
        sync: false
    healthCheckPath: /health
    autoDeploy: true
